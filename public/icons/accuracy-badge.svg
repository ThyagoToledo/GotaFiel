<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Rosette / Medal Ribbon Ribs -->
  <path d="M26 42l-4 14 10-4 10 4-4-14z" fill="#006439" stroke="#0f2438" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Medal Core Seal -->
  <circle cx="32" cy="28" r="18" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" />
  <circle cx="32" cy="28" r="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Metric Target Checkmark (≥ 95%) -->
