<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nozzleGrad" x1="20" y1="8" x2="44" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="sprayGrad" x1="32" y1="34" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#3D2FD6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#006439" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f2438" fill-opacity="0.04" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Nozzle Body (ISO Tip) -->
  <path d="M24 10h16v6l-4 8v6h-8v-6l-4-8v-6z" fill="url(#nozzleGrad)" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Metallic Retaining Ring -->
  <rect x="22" y="8" width="20" height="4" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1" />
  <rect x="26" y="28" width="12" height="3" rx="1.5" fill="#fef3c7" />

  <!-- Fan Spray Pattern -->
  <path d="M32 32 L12 56 Q32 52 52 56 Z" fill="url(#sprayGrad)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.7" />

  <!-- Spray Droplet Particles -->
  <circle cx="22" cy="46" r="1.5" fill="#00E5FF" />
  <circle cx="32" cy="43" r="2" fill="#00E5FF" />
  <circle cx="42" cy="48" r="1.5" fill="#00E5FF" />
  <circle cx="16" cy="54" r="1" fill="#3D2FD6" />
  <circle cx="28" cy="52" r="1.2" fill="#006439" />
  <circle cx="36" cy="53" r="1.5" fill="#006439" />
  <circle cx="48" cy="54" r="1" fill="#3D2FD6" />

  <!-- Pressure Indicator Dial / Gauge -->
  <circle cx="48" cy="18" r="8" fill="#ffffff" stroke="#006439" stroke-width="1.5" />
  <path d="M48 18l4-3" stroke="#ba1a1a" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="48" cy="18" r="1.5" fill="#006439" />
</svg>
