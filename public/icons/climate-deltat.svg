<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tempGrad" x1="22" y1="14" x2="22" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ba1a1a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#006439" />
    </linearGradient>
  </defs>

  <!-- Background Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f2438" fill-opacity="0.04" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Thermometer Body -->
  <rect x="18" y="12" width="8" height="28" rx="4" fill="#ffffff" stroke="#006439" stroke-width="1.5" />
  <circle cx="22" cy="44" r="8" fill="#ffffff" stroke="#006439" stroke-width="1.5" />

  <!-- Mercury Column -->
  <rect x="20" y="22" width="4" height="18" rx="2" fill="url(#tempGrad)" />
  <circle cx="22" cy="44" r="5.5" fill="#006439" />

  <!-- Graduation Marks -->
  <path d="M26 18h3M26 24h3M26 30h3" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />

  <!-- Wind / Aerodynamic Drift Streamlines -->
  <path d="M36 20h14a4 4 0 0 1 0 8h-4" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" />
  <path d="M34 32h20a3 3 0 0 0 0-6" stroke="#3D2FD6" stroke-width="2" stroke-linecap="round" />
  <path d="M38 42h12a3.5 3.5 0 0 1 0 7h-2" stroke="#006439" stroke-width="2" stroke-linecap="round" />

  <!-- Delta T Greek Symbol Badge -->
  <circle cx="50" cy="14" r="7" fill="#0f2438" stroke="#ffffff" stroke-width="1.5" />
  <text x="50" y="17.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#00E5FF" text-anchor="middle">ΔT</text>
</svg>
