      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3D2FD6" />
      <stop offset="100%" stop-color="#006439" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#006439" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#006439" stop-opacity="0.05" />
