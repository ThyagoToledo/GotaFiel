  <path d="M26 12h12v8l14 26a4 4 0 0 1-3.5 6H15.5a4 4 0 0 1-3.5-6l14-26v-8z" fill="#ffffff" stroke="#006439" stroke-width="2" stroke-linejoin="round" />

  <!-- Flask Neck Ring -->
  <rect x="24" y="10" width="16" height="3" rx="1.5" fill="#006439" />

  <!-- Layered Liquid Inside Flask (WALES Sequence) -->
