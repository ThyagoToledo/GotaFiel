<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="liquidGrad" x1="20" y1="28" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3D2FD6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#006439" />
    </linearGradient>
  </defs>

  <!-- Background Base Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#006439" fill-opacity="0.04" stroke="#006439" stroke-width="1.5" stroke-opacity="0.3" />

