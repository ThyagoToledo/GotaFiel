  <!-- WALES Sequence Bubbles & Agitation Swirl -->
  <path d="M26 44q6-3 12 0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />
  <circle cx="28" cy="48" r="1.5" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="36" cy="46" r="2" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="42" cy="49" r="1.2" fill="#ffffff" fill-opacity="0.9" />

  <!-- Timer / Stopwatch Badge for 15-min Jar Test -->
